name: Deploy rubik-trainer to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/exciting-lamport-awfert
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload rubik-trainer as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: rubik-trainer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
